<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>DAISIES V4 · Throw a Daisy</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b19;color:white;font-family:-apple-system,BlinkMacSystemFont,sans-serif}#camera{position:absolute;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#111}#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#07071690,transparent 25%,transparent 60%,#080815a8);pointer-events:none}.top{position:absolute;top:calc(env(safe-area-inset-top) + 16px);left:16px;right:16px;display:flex;align-items:center;justify-content:space-between;gap:8px}.logo{font-weight:750;letter-spacing:2px;font-size:14px}.status{font-size:11px;background:#19182ebd;padding:8px 10px;border-radius:20px;max-width:62%;text-align:right}.bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 20px);left:12px;right:12px;display:flex;flex-direction:column;align-items:center;gap:12px}.prompt{font-size:14px;text-shadow:0 2px 8px black;text-align:center}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}button{border:0;background:#dfc3ff;color:#1b1030;font-weight:700;border-radius:22px;padding:12px 15px;font-size:13px}button.secondary{background:#22213ccf;color:white;border:1px solid #9994bb66}.panel{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 138px);max-height:32vh;overflow:auto;background:#0a091bdc;border:1px solid #ffffff33;border-radius:14px;padding:10px;font:11px/1.6 ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap;display:none}.panel.show{display:block}.lyrics{position:absolute;top:67%;left:15px;right:15px;text-align:center;font-size:24px;font-weight:800;text-shadow:0 2px 15px #000}.hint{font-size:12px;color:#c7b9e7;margin-top:6px;font-weight:400}</style></head><body><video id="camera" autoplay muted playsinline></video><canvas id="fx"></canvas><div class="shade"></div><div class="top"><span class="logo">✿ DAISIES / V4</span><span id="status" class="status">等待启动</span></div><div class="lyrics">Throwing petals <span style="color:#efb8f6">✿</span><div class="hint">手掌向左或右挥动，抛出雏菊</div></div><div id="log" class="panel"></div><div class="bottom"><div id="prompt" class="prompt">先开启相机，再开启手势识别</div><div class="controls"><button id="start">① 开启相机</button><button id="hands">② 开启手势</button><button id="throw" class="secondary">🌼 手动抛花</button><button id="debug" class="secondary">诊断日志</button></div></div><script>
const video=document.getElementById('camera'),canvas=document.getElementById('fx'),ctx=canvas.getContext('2d'),statusEl=document.getElementById('status'),logEl=document.getElementById('log'),promptEl=document.getElementById('prompt');let stream=null,detector=null,tracking=false,busy=false,previous=null,lastThrow=0,flowers=[],sparks=[];
function log(s){let t=new Date().toLocaleTimeString('zh-CN',{hour12:false});logEl.textContent+=`${t} ${s}\n`;logEl.scrollTop=logEl.scrollHeight;statusEl.textContent=s.slice(0,36);}
window.addEventListener('error',e=>log('JS错误: '+e.message));window.addEventListener('unhandledrejection',e=>log('Promise错误: '+String(e.reason)));
function resize(){let d=devicePixelRatio||1;canvas.width=innerWidth*d;canvas.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
async function startCamera(){try{log('正在请求前置摄像头…');if(!navigator.mediaDevices?.getUserMedia)throw Error('getUserMedia不可用，请用Safari HTTPS网址');if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;await video.play();log('摄像头成功 '+video.videoWidth+'×'+video.videoHeight);promptEl.textContent='摄像头已开启！下一步点②开启手势';}catch(e){log('摄像头失败 '+e.name+': '+e.message);logEl.classList.add('show')}}
document.getElementById('start').onclick=startCamera;
function loadScript(url){return new Promise((resolve,reject)=>{let s=document.createElement('script');s.src=url;s.onload=resolve;s.onerror=()=>reject(Error('脚本加载失败：'+url));document.head.appendChild(s)})}
async function startHands(){if(!stream){log('请先开启摄像头');return}if(tracking){log('手势识别已经启动');return}try{log('正在下载手势识别模型（需要网络）…');if(!window.Hands)await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js');detector=new Hands({locateFile:file=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/'+file});detector.setOptions({maxNumHands:2,modelComplexity:0,minDetectionConfidence:.55,minTrackingConfidence:.5});detector.onResults(onHands);tracking=true;log('手势识别已启动；请挥动手掌');detectLoop();}catch(e){tracking=false;log('手势初始化失败 '+e.message);logEl.classList.add('show')}}
document.getElementById('hands').onclick=startHands;
async function detectLoop(){if(!tracking)return;if(video.readyState>=2&&!busy){busy=true;try{await detector.send({image:video})}catch(e){log('识别运行错误: '+e.message);tracking=false;logEl.classList.add('show')}finally{busy=false}}if(tracking)setTimeout(detectLoop,75)}
function onHands(results){let hands=results.multiHandLandmarks||[];if(!hands.length){previous=null;return}let hand=hands[0],p=hand[9],x=1-p.x,y=p.y,now=performance.now();if(previous){let dt=now-previous.t,dx=x-previous.x,dy=y-previous.y;let speed=Math.hypot(dx,dy)/(dt/1000);if(dt<350&&speed>0.65&&now-lastThrow>950){spawn(x*innerWidth,y*innerHeight,Math.sign(dx)||1);lastThrow=now;log('识别到挥手！已抛出雏菊')}}previous={x,y,t:now};}
function spawn(x=innerWidth*.48,y=innerHeight*.45,dir=1){flowers.push({x,y,vx:dir*(3+Math.random()*3),vy:-3-Math.random()*2,rot:0,vr:(Math.random()-.5)*.12,life:160,size:27+Math.random()*12});for(let i=0;i<24;i++){let a=Math.random()*Math.PI*2,s=1+Math.random()*4;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:50,size:1+Math.random()*3})}promptEl.textContent='🌼 Daisy thrown! 再挥一次试试';}
document.getElementById('throw').onclick=()=>{spawn();log('手动抛花成功')};document.getElementById('debug').onclick=()=>logEl.classList.toggle('show');
function daisy(x,y,size,rot,alpha){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.globalAlpha=alpha;ctx.shadowColor='#b6a0ff';ctx.shadowBlur=17;for(let i=0;i<10;i++){ctx.rotate(Math.PI/5);ctx.fillStyle='#f9f5ff';ctx.beginPath();ctx.ellipse(0,-size*.55,size*.20,size*.43,0,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#ffd773';ctx.beginPath();ctx.arc(0,0,size*.23,0,Math.PI*2);ctx.fill();ctx.restore()}
function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);for(let i=flowers.length-1;i>=0;i--){let f=flowers[i];f.x+=f.vx;f.y+=f.vy;f.vy+=.035;f.rot+=f.vr;f.life--;daisy(f.x,f.y,f.size,f.rot,Math.min(1,f.life/35));if(f.life<=0)flowers.splice(i,1)}for(let i=sparks.length-1;i>=0;i--){let p=sparks[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.02;p.life--;ctx.fillStyle=`rgba(214,177,255,${Math.max(0,p.life/50)})`;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();if(p.life<=0)sparks.splice(i,1)}requestAnimationFrame(draw)}draw();log('页面已加载；准备启动摄像头');
</script></body></html>
