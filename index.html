<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>DAISIES V5.2 · Pearlescent Water</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b19;color:white;font-family:-apple-system,BlinkMacSystemFont,sans-serif}#camera{position:absolute;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#111}#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#07071690,transparent 25%,transparent 60%,#080815a8);pointer-events:none}.top{position:absolute;top:calc(env(safe-area-inset-top) + 16px);left:16px;right:16px;display:flex;align-items:center;justify-content:space-between;gap:8px}.logo{font-weight:750;letter-spacing:2px;font-size:14px}.status{font-size:11px;background:#19182ebd;padding:8px 10px;border-radius:20px;max-width:62%;text-align:right}.bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 20px);left:12px;right:12px;display:flex;flex-direction:column;align-items:center;gap:12px}.prompt{font-size:14px;text-shadow:0 2px 8px black;text-align:center}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}button{border:0;background:#dfc3ff;color:#1b1030;font-weight:700;border-radius:22px;padding:12px 15px;font-size:13px}button.secondary{background:#22213ccf;color:white;border:1px solid #9994bb66}.panel{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 138px);max-height:32vh;overflow:auto;background:#0a091bdc;border:1px solid #ffffff33;border-radius:14px;padding:10px;font:11px/1.6 ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap;display:none}.panel.show{display:block}.lyrics{position:absolute;top:67%;left:15px;right:15px;text-align:center;font-size:24px;font-weight:800;text-shadow:0 2px 15px #000}.hint{font-size:12px;color:#c7b9e7;margin-top:6px;font-weight:400}.love-title{position:absolute;top:16%;left:0;right:0;text-align:center;pointer-events:none;font-weight:800;font-size:clamp(22px,7vw,36px);letter-spacing:1px;text-shadow:0 0 20px #ffb9e9;opacity:0;transition:opacity .4s}.love-title.on{opacity:1}.love-title small{display:block;font-size:13px;font-weight:500;margin-top:8px;color:#ffe4f3}.lyrics.hide{opacity:0}.lyrics{transition:opacity .3s}.bottom{z-index:5}.mode{font-size:11px;color:#ffe7f6;text-shadow:0 2px 8px #000}</style></head><body><video id="camera" autoplay muted playsinline></video><canvas id="fx"></canvas><div class="shade"></div><div class="top"><span class="logo">✿ DAISIES / V5.1</span><span id="status" class="status">等待启动</span></div><div class="lyrics">Throwing petals <span style="color:#efb8f6">✿</span><div class="hint">手掌向左或右挥动，抛出雏菊</div></div><div id="loveTitle" class="love-title">Love me or not?<small>爱我，还是不爱我？</small></div><div id="log" class="panel"></div><div class="bottom"><div id="prompt" class="prompt">先开启相机，再开启手势识别</div><div class="controls"><button id="start">① 开启相机</button><button id="hands">② 开启手势</button><button id="throw" class="secondary">🌼 抛花</button><button id="love" class="secondary">💗 梦幻爱心</button><button id="mode" class="secondary">切换场景</button><button id="clean" class="secondary">隐藏按钮</button><button id="debug" class="secondary">诊断日志</button></div></div><script>
const video=document.getElementById('camera'),canvas=document.getElementById('fx'),ctx=canvas.getContext('2d'),statusEl=document.getElementById('status'),logEl=document.getElementById('log'),promptEl=document.getElementById('prompt');let stream=null,detector=null,tracking=false,busy=false,previous=null,lastThrow=0,flowers=[],sparks=[];let scene="petals",heart=null,lastBurst=0,prevDistance=null,heartParticles=[],ripples=[],ambient=[];let lastRipple=0;
function log(s){let t=new Date().toLocaleTimeString('zh-CN',{hour12:false});logEl.textContent+=`${t} ${s}\n`;logEl.scrollTop=logEl.scrollHeight;statusEl.textContent=s.slice(0,36);}
window.addEventListener('error',e=>log('JS错误: '+e.message));window.addEventListener('unhandledrejection',e=>log('Promise错误: '+String(e.reason)));
function resize(){let d=devicePixelRatio||1;canvas.width=innerWidth*d;canvas.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
async function startCamera(){try{log('正在请求前置摄像头…');if(!navigator.mediaDevices?.getUserMedia)throw Error('getUserMedia不可用，请用Safari HTTPS网址');if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;await video.play();log('摄像头成功 '+video.videoWidth+'×'+video.videoHeight);promptEl.textContent='摄像头已开启！下一步点②开启手势';}catch(e){log('摄像头失败 '+e.name+': '+e.message);logEl.classList.add('show')}}
document.getElementById('start').onclick=startCamera;
function loadScript(url){return new Promise((resolve,reject)=>{let s=document.createElement('script');s.src=url;s.onload=resolve;s.onerror=()=>reject(Error('脚本加载失败：'+url));document.head.appendChild(s)})}
async function startHands(){if(!stream){log('请先开启摄像头');return}if(tracking){log('手势识别已经启动');return}try{log('正在下载手势识别模型（需要网络）…');if(!window.Hands)await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js');detector=new Hands({locateFile:file=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/'+file});detector.setOptions({maxNumHands:2,modelComplexity:0,minDetectionConfidence:.55,minTrackingConfidence:.5});detector.onResults(onHands);tracking=true;log('手势识别已启动；请挥动手掌');detectLoop();}catch(e){tracking=false;log('手势初始化失败 '+e.message);logEl.classList.add('show')}}
document.getElementById('hands').onclick=startHands;
async function detectLoop(){if(!tracking)return;if(video.readyState>=2&&!busy){busy=true;try{await detector.send({image:video})}catch(e){log('识别运行错误: '+e.message);tracking=false;logEl.classList.add('show')}finally{busy=false}}if(tracking)setTimeout(detectLoop,75)}
function onHands(results){let hands=results.multiHandLandmarks||[];if(!hands.length){previous=null;prevDistance=null;return}
if(scene==='love'&&hands.length>=2){let a=hands[0][9],b=hands[1][9],ax=1-a.x,bx=1-b.x,ay=a.y,by=b.y;let d=Math.hypot(ax-bx,ay-by),cx=(ax+bx)*.5*innerWidth,cy=(ay+by)*.5*innerHeight;let now=performance.now();if(!heart)heart={x:cx,y:cy,r:90,energy:1,age:0};heart.x+=(cx-heart.x)*.25;heart.y+=(cy-heart.y)*.25;heart.r+=(Math.max(95,Math.min(Math.min(innerWidth*.43,230),d*innerWidth*1.08))-heart.r)*.22;heart.energy=1;if(now-lastRipple>390){addRipple(cx,cy,Math.min(105,heart.r*.55),"pink",.65);lastRipple=now}if(prevDistance!==null&&d-prevDistance>.09&&now-lastBurst>1100){burstHeart(heart.x,heart.y,heart.r);lastBurst=now;log('双手展开：粉白粒子扩散')}prevDistance=d;previous=null;return}
prevDistance=null;if(scene==='love'){previous=null;return}let hand=hands[0],p=hand[9],x=1-p.x,y=p.y,now=performance.now();if(previous){let dt=now-previous.t,dx=x-previous.x,dy=y-previous.y;let speed=Math.hypot(dx,dy)/(dt/1000);if(dt<350&&speed>0.65&&now-lastThrow>950){spawn(x*innerWidth,y*innerHeight,Math.sign(dx)||1);lastThrow=now;log('识别到挥手！已抛出雏菊')}}previous={x,y,t:now};}
function addRipple(x,y,r=20,tone="pearl",power=1){ripples.push({x,y,r,age:0,max:65+Math.random()*22,power,tone});if(ripples.length>32)ripples.shift()}
function spawn(x=innerWidth*.48,y=innerHeight*.45,dir=1){
  addRipple(x,y,12,"pearl",.65);
  setTimeout(()=>addRipple(x,y,23,"lavender",.38),130);
  // 一次抛出数朵小雏菊，避免单朵大贴纸感
  const count=5+Math.floor(Math.random()*3);
  for(let i=0;i<count;i++){
    const spread=(i-(count-1)/2)*11;
    flowers.push({x:x+(Math.random()-.5)*15,y:y+(Math.random()-.5)*13,
      vx:dir*(1.4+Math.random()*1.8)+(Math.random()-.5)*1.2,
      vy:-1.5-Math.random()*1.6+spread*.035,
      rot:Math.random()*Math.PI*2,vr:(Math.random()-.5)*.042,
      life:135+Math.random()*50,size:12+Math.random()*8,age:0,
      tint:Math.random()<.55?'cream':'yellow'});
  }
  for(let i=0;i<14;i++){let a=Math.random()*Math.PI*2,s=.6+Math.random()*2;
    sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:42,size:.4+Math.random()*.8})}
  promptEl.textContent='🌼 小雏菊随水波飘散 · 再挥一次';
}
document.getElementById('throw').onclick=()=>{spawn();log('手动抛花成功')};
function setScene(v){scene=v;heart=null;prevDistance=null;document.querySelector('.lyrics').classList.toggle('hide',v==='love');document.getElementById('loveTitle').classList.toggle('on',v==='love');promptEl.textContent=v==='love'?'双手慢慢展开，推动粉白色水波纹':'手掌左右挥动，抛出雏菊';log('场景：'+v)}
document.getElementById('mode').onclick=()=>setScene(scene==='petals'?'love':'petals');
document.getElementById('love').onclick=()=>{setScene('love');heart={x:innerWidth/2,y:innerHeight*.43,r:Math.min(innerWidth*.36,145),energy:1,age:0};setTimeout(()=>{if(heart)burstHeart(heart.x,heart.y,heart.r)},650)};
document.getElementById('clean').onclick=()=>{document.querySelector('.controls').style.display='none';promptEl.textContent='轻点屏幕右上角恢复按钮';};document.querySelector('.top').addEventListener('click',()=>{document.querySelector('.controls').style.display='flex'});
function heartPoint(t){let x=16*Math.pow(Math.sin(t),3),y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));return [x/18,y/18]}
function burstHeart(x,y,r){addRipple(x,y,r*.65,"pink",1.7);setTimeout(()=>addRipple(x,y,r*.9,"pearl",.8),150);for(let i=0;i<95;i++){let t=Math.random()*Math.PI*2,[hx,hy]=heartPoint(t),angle=Math.atan2(hy,hx),speed=1.5+Math.random()*4;heartParticles.push({x:x+hx*r,y:y+hy*r,vx:Math.cos(angle)*speed+(Math.random()-.5)*2,vy:Math.sin(angle)*speed+(Math.random()-.5)*2,life:75+Math.random()*45,max:120,size:.65+Math.random()*1.5})}heart=null}
function drawHeart(h){let t=performance.now()*.001;h.age=(h.age||0)+1;ctx.save();ctx.translate(h.x,h.y);ctx.globalAlpha=Math.min(.83,h.age/35);ctx.globalCompositeOperation='screen';for(let layer=2;layer>=0;layer--){let r=h.r*(.95+layer*.018)*(.85+.15*Math.min(1,h.age/35));ctx.beginPath();for(let i=0;i<=140;i++){let a=i/140*Math.PI*2,[x,y]=heartPoint(a);if(!i)ctx.moveTo(x*r,y*r);else ctx.lineTo(x*r,y*r)}ctx.closePath();ctx.strokeStyle=['rgba(255,250,255,.8)','rgba(255,215,234,.33)','rgba(217,204,255,.12)'][layer];ctx.lineWidth=[1.4,3.1,6.2][layer];ctx.shadowBlur=[5,11,16][layer];ctx.shadowColor='#ffe6f2';ctx.stroke()}for(let i=0;i<42;i++){let a=i/42*Math.PI*2,[x,y]=heartPoint(a);ctx.beginPath();ctx.fillStyle=i%3===0?'rgba(255,255,255,.8)':'rgba(255,218,238,.65)';ctx.shadowBlur=5;ctx.arc(x*h.r,y*h.r,0.6+(i%3)*.25,0,Math.PI*2);ctx.fill()}ctx.restore()}
document.getElementById('debug').onclick=()=>logEl.classList.toggle('show');
function daisy(x,y,size,rot,alpha,tint='cream'){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  ctx.globalAlpha=alpha*.9;ctx.globalCompositeOperation='screen';
  const yellow=tint==='yellow';
  for(let i=0;i<9;i++){
    ctx.save();ctx.rotate(i*Math.PI*2/9);ctx.beginPath();
    ctx.ellipse(0,-size*.42,size*.175,size*.32,0,0,Math.PI*2);
    ctx.fillStyle=yellow?'rgba(255,227,155,.46)':'rgba(255,249,230,.38)';
    ctx.fill();ctx.strokeStyle=yellow?'rgba(255,221,148,.7)':'rgba(255,248,231,.72)';
    ctx.lineWidth=.65;ctx.shadowColor=yellow?'#ffe6a8':'#fff1dd';ctx.shadowBlur=2.5;
    ctx.stroke();ctx.restore();
  }
  ctx.beginPath();ctx.arc(0,0,size*.13,0,Math.PI*2);
  ctx.fillStyle=yellow?'rgba(247,191,76,.9)':'rgba(241,204,109,.86)';
  ctx.fill();ctx.restore();
}
function drawRipples(){for(let i=ripples.length-1;i>=0;i--){let p=ripples[i];p.age++;let k=p.age/p.max,r=p.r+(Math.min(innerWidth,innerHeight)*.36)*k;let fade=(1-k)*(1-k)*Math.min(1,p.power)*.78;ctx.save();ctx.globalCompositeOperation='screen';ctx.translate(p.x,p.y);ctx.scale(1,.62);for(let layer=0;layer<3;layer++){ctx.beginPath();ctx.arc(0,0,r+layer*5,0,Math.PI*2);ctx.lineWidth=[1.25,2.5,5][layer];let rgb=p.tone==='pink'?'255,219,237':p.tone==='lavender'?'226,214,255':'247,245,255';ctx.strokeStyle=`rgba(${rgb},${fade*[.7,.21,.065][layer]})`;ctx.shadowBlur=[5,9,13][layer];ctx.shadowColor='#ffe6f2';ctx.stroke()}ctx.restore();if(p.age>=p.max)ripples.splice(i,1)}}
function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);drawRipples();if(scene==='love'&&heart)drawHeart(heart);for(let i=heartParticles.length-1;i>=0;i--){let p=heartParticles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.988;p.vy*=.988;p.life--;ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.shadowColor='#ffbfdf';ctx.shadowBlur=7;ctx.fillStyle=i%4===0?'#fff':'#ffcfeb';ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.restore();if(p.life<=0)heartParticles.splice(i,1)}for(let i=flowers.length-1;i>=0;i--){let f=flowers[i];f.x+=f.vx;f.y+=f.vy;f.vy+=.035;f.rot+=f.vr;f.life--;f.age++;daisy(f.x,f.y,f.size*(.5+.5*Math.min(1,f.age/16)),f.rot,Math.min(1,f.age/12,f.life/35),f.tint);if(f.life<=0)flowers.splice(i,1)}for(let i=sparks.length-1;i>=0;i--){let p=sparks[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.02;p.life--;ctx.fillStyle=`rgba(255,225,242,${Math.max(0,p.life/50)*.65})`;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();if(p.life<=0)sparks.splice(i,1)}requestAnimationFrame(draw)}draw();log('V5.3 小雏菊版已加载；先开摄像头与手势');
</script></body></html>
